name: Release

# Pushing a tag vX.Y.Z (the version in package.json) builds, verifies and PUBLISHES the package on npm via trusted
# publishing (OIDC, no token) with provenance. Only this workflow file in this repository may publish.
# npm side (once): a trusted publisher for this repository and workflow file (release.yml) with publish allowed,
# e.g. `npm trust github @mgamadeus/ddd-admin-ui --repository ddd-framework/ddd-admin-ui --file release.yml --allow-publish`.

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      # Words that must not appear in shipped files (repository variable, comma-separated; not committed).
      CHECK_PACKAGE_DENY: ${{ vars.CHECK_PACKAGE_DENY }}
    steps:
      - uses: actions/checkout@v4
      # No `registry-url` here: it writes an .npmrc with `_authToken=${NODE_AUTH_TOKEN}` plus a placeholder token,
      # which npm then sends instead of exchanging the OIDC token (E401). The default registry is npmjs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (pnpm version from package.json)
        run: npm i -g corepack@latest && corepack enable
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; this workflow requires 11.15.
      - name: Install npm with trusted publishing
        run: |
          npm install -g npm@11
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 15)) { console.error(`npm ${process.argv[1]} < 11.15.0`); process.exit(1); }
          ' "$(npm --version)"
          npm --version
      - name: Tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION} (expected v${VERSION})" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # list tables without the optional props render as in 0.1.0-rc.2; status map contexts reach the badge
      - run: pnpm test:render
      - name: Published manifest has no workspace-only specifiers
        run: |
          if grep -E '"(workspace|link|file):' package.json; then
            echo "package.json contains workspace:/link:/file: specifiers" >&2
            exit 1
          fi
      - name: i18n-keys.json is current
        run: node scripts/build-i18n-manifest.mjs --check
      - name: tokens.json utilities lists are current
        run: node scripts/tokens-utilities.mjs
      - name: Package checks on the build
        run: node scripts/check-package.mjs --dir . --require-deny-list
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Package checks on the extracted tarball
        run: |
          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xzf "$(ls "$RUNNER_TEMP"/mgamadeus-ddd-admin-ui-*.tgz)" -C "$RUNNER_TEMP/extracted"
          node scripts/check-package.mjs --dir "$RUNNER_TEMP/extracted/package" --modules node_modules --require-deny-list
      - name: Consumer check with npm
        run: test/consumer/run.sh "$(ls "$RUNNER_TEMP"/mgamadeus-ddd-admin-ui-*.tgz)" npm "$RUNNER_TEMP/consumer-npm"
      - name: Consumer check with pnpm
        run: test/consumer/run.sh "$(ls "$RUNNER_TEMP"/mgamadeus-ddd-admin-ui-*.tgz)" pnpm "$RUNNER_TEMP/consumer-pnpm"
      - name: Consumer check with the peer floors
        run: |
          DDD_WEB_VERSION=0.13.0 LUCIDE_VERSION=0.550.0 \
            test/consumer/run.sh "$(ls "$RUNNER_TEMP"/mgamadeus-ddd-admin-ui-*.tgz)" npm "$RUNNER_TEMP/consumer-floors"
      # The verified tarball itself is published (no rebuild). Prerelease versions (x.y.z-…) need an explicit dist-tag.
      - name: Publish (trusted publishing, provenance)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in *-*) DIST_TAG=next ;; *) DIST_TAG=latest ;; esac
          unset NODE_AUTH_TOKEN
          if npm view "@mgamadeus/ddd-admin-ui@${VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@mgamadeus/ddd-admin-ui@${VERSION} is already on npm, nothing to publish"
            exit 0
          fi
          npm publish "$(ls "$RUNNER_TEMP"/mgamadeus-ddd-admin-ui-*.tgz)" --provenance --tag "$DIST_TAG" --access public --registry https://registry.npmjs.org
